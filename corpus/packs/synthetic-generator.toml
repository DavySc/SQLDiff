# Synthetic pack for the corpus: describes the provenance markers that a made-up
# code generator writes into its output (design §3 layer 4, §5.3). Format:
# docs/packs-and-config.md.

[pack]
name = "synthetic-generator"
version = "0.2.0"
description = "Provenance markers and template syntax of a made-up generator"

# A part starts with a line comment naming the part and its template, and ends
# with a closing marker on its own line. Parts do not nest. Named groups other
# than `part` and `template` would become the part's parameters.
[[composition]]
name = "part markers"
begin = '^-- \[part:(?P<part>[a-z0-9-]+) template=(?P<template>[a-z0-9-]+)\]$'
end = '^-- \[/part\]$'

# Placeholders as the generator's templates spell them, `{{NAME}}`. The corpus
# fixtures contain only composed output.
[template]
open = "{{"
close = "}}"
name_pattern = "[A-Z][A-Z0-9_]*"
parameter_sources = ["composition"]
collision = "error"
