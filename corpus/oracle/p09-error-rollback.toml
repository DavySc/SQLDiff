case = "p09-error-rollback"
pairs = [["tsql", "pg"]]
observe = ["order_line(order_id, line_no, item_id, qty, unit_price)", "stock(item_id, qty)"]
faults = ["order_line", "stock"]
seed = """
INSERT INTO customer (customer_id, email, first_name, last_name, created_at)
VALUES (1, 'ann@example.com', 'Ann', 'Archer', '2026-01-01 10:00:00');
INSERT INTO item (item_id, name) VALUES (1, 'bolt');
INSERT INTO stock (item_id, qty) VALUES (1, 10);
INSERT INTO item_price (item_id, unit_price) VALUES (1, 2.50);
INSERT INTO orders (customer_id, status, created_at) VALUES (1, 'N', '2026-01-02 09:00:00');
"""

[[scenario]]
name = "add a line"
call.tsql = "EXEC dbo.add_order_line 1, 1, 1, 4;"
call.pg = "CALL add_order_line(1, 1, 1, 4);"
