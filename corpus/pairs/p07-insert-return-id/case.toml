id = "p07-insert-return-id"
title = "Return the generated key of an insert"
refs = ["design §7 triggers, handlers and substitutes"]
tags = ["identity"]
description = """
SCOPE_IDENTITY(), RETURNING and FINAL TABLE all return the key generated by this
statement, unaffected by triggers (unlike @@IDENTITY).
"""

[sides.tsql]
dialect = "tsql"
file = "tsql.sql"

[sides.pg]
dialect = "pg"
file = "pg.sql"

[sides.db2i]
dialect = "db2i"
file = "db2i.sql"

[[expect]]
a = "tsql"
b = "pg"
verdict = "equal"
classes = ["structural"]

[[expect]]
a = "tsql"
b = "db2i"
verdict = "equal"
classes = ["structural"]

[[expect]]
a = "pg"
b = "db2i"
verdict = "equal"
classes = ["structural"]
