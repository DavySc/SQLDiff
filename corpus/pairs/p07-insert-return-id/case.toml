id = "p07-insert-return-id"
title = "Return the generated key of an insert"
refs = ["design §7 triggers, handlers and substitutes"]
tags = ["identity"]
description = """
SCOPE_IDENTITY(), RETURNING and FINAL TABLE all return the key generated by this
statement, unaffected by triggers (unlike @@IDENTITY).
"""

[sides.tsql]
dialect = "tsql"
file = "tsql.sql"

[sides.pg]
dialect = "pg"
file = "pg.sql"

[sides.db2i]
dialect = "db2i"
file = "db2i.sql"

[[expect]]
a = "tsql"
b = "pg"
verdict = "different"
classes = ["transactional"]
assumptions = ["caller XACT_ABORT is off"]
witnesses = [
  "If the INSERT fails, T-SQL reports the error and continues, so a calling batch goes on with @OrderId = NULL; PostgreSQL raises and the caller's transaction is aborted.",
]

[[expect]]
a = "tsql"
b = "db2i"
verdict = "different"
classes = ["transactional"]
assumptions = [
  "caller XACT_ABORT is off",
  "Db2 for i ends the procedure and returns the error to the caller when the INSERT fails and no handler is declared (not verified on a real system)",
]
witnesses = [
  "If the INSERT fails, T-SQL reports the error and continues, so a calling batch goes on with @OrderId = NULL; Db2 for i ends the procedure with the SQLSTATE.",
]

[[expect]]
a = "pg"
b = "db2i"
verdict = "equal-under-assumptions"
assumptions = ["the Db2 for i routine without USRPRF runs with the caller's authority", "unquoted names name the same objects after case folding", "unqualified names, dbo and public resolve to the same schema"]
classes = ["structural"]
