id = "p06-paged-orders"
title = "Paged read with a total order"
refs = ["design §3 canonical paged-read node", "design §7 cardinality contracts"]
tags = ["idiom", "paging"]
description = """
OFFSET/FETCH, LIMIT/OFFSET and OFFSET/FETCH FIRST lift to the same paged-read node.
The sort key ends in the primary key, so the page is deterministic on every side.
"""

[sides.tsql]
dialect = "tsql"
file = "tsql.sql"

[sides.pg]
dialect = "pg"
file = "pg.sql"

[sides.db2i]
dialect = "db2i"
file = "db2i.sql"

[[expect]]
a = "tsql"
b = "pg"
verdict = "equal-under-assumptions"
assumptions = ["the STABLE/IMMUTABLE/DETERMINISTIC label is truthful", "callers hold the privileges themselves (no T-SQL ownership chain needed)", "unquoted names name the same objects after case folding", "unqualified names, dbo and public resolve to the same schema"]
classes = ["structural"]

[[expect]]
a = "tsql"
b = "db2i"
verdict = "equal-under-assumptions"
assumptions = ["the Db2 for i routine without USRPRF runs with the caller's authority", "callers hold the privileges themselves (no T-SQL ownership chain needed)", "unquoted names name the same objects after case folding", "unqualified names, dbo and public resolve to the same schema"]
classes = ["structural"]

[[expect]]
a = "pg"
b = "db2i"
verdict = "equal-under-assumptions"
assumptions = ["the STABLE/IMMUTABLE/DETERMINISTIC label is truthful", "the Db2 for i routine without USRPRF runs with the caller's authority", "unquoted names name the same objects after case folding", "unqualified names, dbo and public resolve to the same schema"]
classes = ["structural"]
