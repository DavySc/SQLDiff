name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The leak scan reads every commit of the push or pull request.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Db2 for i probes (script up to date, ingest tests)
        run: |
          python3 probes/db2i/db2i_probes.py check
          python3 -m unittest discover -s probes/db2i
      - name: Hook self-test
        run: bash scripts/test-hooks.sh
      - name: Leak scan
        env:
          # Salted hashes from `sqldiff pack deny-hashes`; the terms never reach CI.
          SQLDIFF_DENYHASHES: ${{ secrets.SQLDIFF_DENYHASHES }}
          # Forks get no secrets; everywhere else a missing list is a failure.
          SQLDIFF_REQUIRE_DENYLIST: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cargo build -p sqldiff-cli
          scripts/leak-scan.sh
          # Every commit, so a leak added and removed again is still caught.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then range="$BASE..$HEAD"; else range="$HEAD"; fi
          scripts/leak-scan.sh --commits "$range"

  # Colleagues run SQLDiff on Windows, where git checks out with
  # core.autocrlf=true: sources, the corpus and the test code have CRLF line
  # endings here (except what .gitattributes pins to LF).
  test-windows:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every Windows-only failure at once, not only the first test binary's.
      - run: cargo test --workspace --no-fail-fast
      # A checkout made before .gitattributes pinned tests/fixtures to LF
      # still has CRLF fixtures: the tests must pass on those too.
      - name: Tests on CRLF fixtures
        shell: bash
        run: |
          sed -i 's/\r$//; s/$/\r/' tests/fixtures/*
          cargo test --workspace --no-fail-fast
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Db2 for i probes (script up to date, ingest tests)
        run: |
          python probes/db2i/db2i_probes.py check
          python -m unittest discover -s probes/db2i
