name: corpus

on:
  push:
    paths: ["corpus/**", ".github/workflows/corpus.yml"]
  pull_request:
    paths: ["corpus/**", ".github/workflows/corpus.yml"]

env:
  # Throwaway password for the CI-only SQL Server container.
  MSSQL_SA_PASSWORD: Corpus_Passw0rd!

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corpus
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Corpus_Passw0rd!
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Corpus_Passw0rd! -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate corpus
        run: >-
          python3 corpus/tools/check_corpus.py
          --pg "host=localhost port=5432 user=postgres password=postgres dbname=corpus"
          --mssql "docker exec -i ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd
          -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -b -I"
