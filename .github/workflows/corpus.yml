name: corpus

on:
  push:
    paths: ["corpus/**", ".github/workflows/corpus.yml"]
  pull_request:
    paths: ["corpus/**", ".github/workflows/corpus.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corpus
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate corpus
        run: >-
          python3 corpus/tools/check_corpus.py
          --pg "host=localhost port=5432 user=postgres password=postgres dbname=corpus"
