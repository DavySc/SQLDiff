  { label = "error, rows changed", when = { create = "00000", state = "!00000", n1 = ">0" }, verdict = "contradicts", meaning = "Rejected, but some rows stayed changed under *CS: the ATOMIC default did not hold." },
  { label = "accepted", when = { create = "00000", state = "00000" }, verdict = "contradicts", meaning = "The MERGE ran without error (n1 rows changed)." },
]

