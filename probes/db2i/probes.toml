# ---------------------------------------------------------------- V26
# Common table expressions, run as dynamic queries (as in a script). The
# procedure makes the table SQLDFPROBE.CTEB (X = 7), sets the current schema to
# SQLDFPROBE so an unqualified CTEB can mean that table, runs the query Q, and
# reports the first value of its first column (n1) and the number of rows (n2).

[[procedure]]
name = "V26_QUERY"
commit = "*NONE"
# Cursors close when the procedure ends, so a failed run cannot leave C1 open
# for the next call.
options = "CLOSQLCSR = *ENDMOD"
params = "IN Q VARCHAR(4000)"
body = """
BEGIN
  DECLARE V_SQL VARCHAR(4000);
  DECLARE V_OLD VARCHAR(128);
  DECLARE V_EOF INTEGER DEFAULT 0;
  DECLARE V_N INTEGER DEFAULT 0;
  DECLARE X INTEGER;
  DECLARE C1 CURSOR FOR S1;
  SET O_STATE = '00000';
  SET O_CODE = 0;
  SET V_OLD = CURRENT SCHEMA;
  BEGIN
    DECLARE CONTINUE HANDLER FOR SQLEXCEPTION SET V_N = 0;
    SET V_SQL = 'CREATE TABLE SQLDFPROBE.CTEB (X INTEGER)';
    EXECUTE IMMEDIATE V_SQL;
  END;
  BEGIN
    DECLARE EXIT HANDLER FOR SQLEXCEPTION
      GET DIAGNOSTICS CONDITION 1 O_STATE = RETURNED_SQLSTATE,
        O_CODE = DB2_RETURNED_SQLCODE;
    DECLARE CONTINUE HANDLER FOR NOT FOUND SET V_EOF = 1;
    SET V_SQL = 'DELETE FROM SQLDFPROBE.CTEB';
    EXECUTE IMMEDIATE V_SQL;
    SET V_SQL = 'INSERT INTO SQLDFPROBE.CTEB (X) VALUES (7)';
    EXECUTE IMMEDIATE V_SQL;
    SET SCHEMA SQLDFPROBE;
    PREPARE S1 FROM Q;
    OPEN C1;
    FETCH C1 INTO X;
    WHILE V_EOF = 0 AND V_N < 1000 DO
      SET V_N = V_N + 1;
      IF V_N = 1 THEN SET O_N1 = X; END IF;
      FETCH C1 INTO X;
    END WHILE;
    CLOSE C1;
    SET O_N2 = V_N;
  END;
  SET SCHEMA = V_OLD;
END
"""

