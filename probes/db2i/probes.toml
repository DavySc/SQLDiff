# ---------------------------------------------------------------- V32 ORDER BY and FETCH FIRST below the outer query
# T-SQL TOP inside a subquery, derived table, CTE or INSERT ... SELECT becomes
# FETCH FIRST n ROWS ONLY there, after that query's ORDER BY; a view keeps the
# ORDER BY next to TOP 100 PERCENT. Each probe sums or counts what the limited
# query keeps from 1, 2, 3.

[[probe]]
id = "V32-DERIVED"
fact = "V32"
role = "decisive"
procedure = "V27_INT"
args = ["'SELECT SUM(K) FROM (SELECT K FROM (VALUES (1), (2), (3)) AS Q (K) ORDER BY K DESC FETCH FIRST 2 ROWS ONLY) AS S'"]
question = "A derived table with ORDER BY ... DESC FETCH FIRST 2 ROWS ONLY over 1, 2, 3: is it accepted, and does it keep 3 and 2 (sum 5)?"
source = "SQLDiff converts T-SQL TOP inside a query to FETCH FIRST there (crates/sqldiff-convert/src/tsql/paging.rs); the IBM i fetch-clause page could not be read."
outcome = [
  { label = "limited", when = { create = "00000", state = "00000", n1 = "=5" }, verdict = "consistent", meaning = "Accepted, and the limit applies to that query after its own ORDER BY." },
  { label = "other", when = { create = "00000", state = "00000" }, verdict = "contradicts", meaning = "Accepted with another result (in N1): the limit or the order is not applied there." },
  { label = "rejected", when = { create = "00000", state = "!00000" }, verdict = "contradicts", meaning = "Not accepted here (SQLSTATE and SQLCODE recorded): the conversion must not put FETCH FIRST / ORDER BY in this place." },
]

