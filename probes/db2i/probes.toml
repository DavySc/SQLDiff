[[probe]]
id = "V4-UNDO-NONE"
fact = "V4"
role = "decisive"
procedure = "V4_UNDO_NONE"
question = "Under *NONE, does an UNDO handler undo anything?"
source = "Inference in vendor-facts V4; not documented."
outcome = [
  { label = "create rejected", when = { create = "!00000" }, verdict = "consistent", meaning = "Db2 for i refuses UNDO/ATOMIC in a *NONE routine; the create SQLSTATE is the rule." },
  { label = "call rejected", when = { call = "!00000" }, verdict = "consistent", meaning = "The routine is created but refuses to run." },
  { label = "handler error", when = { state = "!00000" }, verdict = "consistent", meaning = "The UNDO could not be carried out and raised an error (see the SQLSTATE)." },
  { label = "nothing undone", when = { state = "00000", n1 = "=1", n2 = "=1" }, verdict = "consistent", meaning = "The UNDO handler ran but the first insert stayed." },
  { label = "undone", when = { state = "00000", n1 = "=0", n2 = "=1" }, verdict = "contradicts", meaning = "The UNDO handler rolled the block back even under *NONE." },
]

