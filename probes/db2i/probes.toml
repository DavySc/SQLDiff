  { label = "NOT LOGGED", when = { create = "00000", state = "00000", n1 = "=0" }, verdict = "open", meaning = "The rollback emptied the table: the default is NOT LOGGED (with ON ROLLBACK DELETE ROWS)." },
  { label = "error", when = { state = "!00000" }, verdict = "open", meaning = "See the SQLSTATE." },
]

