[[probe]]
id = "V4-STMT-NONE"
fact = "V4"
role = "decisive"
procedure = "V4_STMT_NONE"
question = "Under *NONE, does a multi-row INSERT that fails on its third row keep the first two rows?"
source = "ASM-DB2-COMMIT-CS: 'under *NONE nothing, not even a failed statement, is rolled back'. Not documented on the readable pages."
outcome = [
  { label = "rows stay", when = { create = "00000", state = "23505", n1 = "=2" }, verdict = "consistent", meaning = "The rows before the failing one stayed: a failed statement is not undone under *NONE." },
  { label = "statement undone", when = { create = "00000", state = "23505", n1 = "=0" }, verdict = "contradicts", meaning = "Db2 for i undid the failed statement even under *NONE." },
]

[[procedure]]
name = "V4_ROLLBACK_NONE"
commit = "*NONE"
body = """
BEGIN
  SET O_STATE = '00000';
  SET O_CODE = 0;
  DELETE FROM SQLDFPROBE.T WHERE PRB = 47;
  BEGIN
    DECLARE EXIT HANDLER FOR SQLEXCEPTION
      GET DIAGNOSTICS CONDITION 1 O_STATE = RETURNED_SQLSTATE,
        O_CODE = DB2_RETURNED_SQLCODE;
    INSERT INTO SQLDFPROBE.T (PRB, K) VALUES (47, 1);
