# ---------------------------------------------------------------- V7 / V16

[[procedure]]
name = "V7_DGTT_DEFAULT"
commit = "*CS"
body = """
BEGIN
  DECLARE V_SQL VARCHAR(500);
  DECLARE C1 CURSOR FOR S1;
  SET O_STATE = '00000';
  SET O_CODE = 0;
  BEGIN
    DECLARE EXIT HANDLER FOR SQLEXCEPTION
      GET DIAGNOSTICS CONDITION 1 O_STATE = RETURNED_SQLSTATE,
        O_CODE = DB2_RETURNED_SQLCODE;
    SET V_SQL = 'DECLARE GLOBAL TEMPORARY TABLE SESSION.SQLDFP71 '
      || '(K INTEGER) ON COMMIT PRESERVE ROWS WITH REPLACE';
    EXECUTE IMMEDIATE V_SQL;
    SET V_SQL = 'INSERT INTO SESSION.SQLDFP71 (K) VALUES (1)';
    EXECUTE IMMEDIATE V_SQL;
    COMMIT;
    SET V_SQL = 'INSERT INTO SESSION.SQLDFP71 (K) VALUES (2)';
    EXECUTE IMMEDIATE V_SQL;
    ROLLBACK;
    SET V_SQL = 'SELECT COUNT(*) FROM SESSION.SQLDFP71';
    PREPARE S1 FROM V_SQL;
    OPEN C1;
    FETCH C1 INTO O_N1;
    CLOSE C1;
  END;
END
"""

