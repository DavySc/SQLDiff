# ---------------------------------------------------------------- V30 calls and comments
# The engine proves T-SQL EXEC against PostgreSQL CALL, and sp_addextendedproperty
# against COMMENT ON (docs/cross-dialect-proofs.md, "Calls and comments"). Db2 for i
# calls and comments are not compared yet; these are the open questions a Db2 for i
# rule would rest on. No expectation is made: nothing the code does depends on them.

[[procedure]]
name = "V30_CALLEE"
helper = true
commit = "*NONE"
params = "IN A VARCHAR(5), INOUT B VARCHAR(10), OUT C INTEGER"
body = """
BEGIN
  SET O_STATE = '00000';
  SET O_CODE = 0;
  SET O_N1 = LENGTH(A);
  SET O_N2 = 0;
  SET O_TEXT = A || '|' || COALESCE(B, 'null') || '|'
    || COALESCE(TRIM(CHAR(C)), 'null');
  SET B = 'out';
  SET C = 9;
END
"""

[[procedure]]
name = "V30_CALLEE_DEF"
helper = true
commit = "*NONE"
params = "IN A VARCHAR(5), INOUT B VARCHAR(10), OUT C INTEGER, IN D INTEGER DEFAULT 7"
body = """
BEGIN
  SET O_STATE = '00000';
  SET O_CODE = 0;
  SET O_N1 = LENGTH(A);
  SET O_N2 = D;
  SET O_TEXT = A;
  SET B = 'out';
  SET C = 9;
END
"""

[[procedure]]
name = "V30_POS"
commit = "*NONE"
params = "IN S VARCHAR(20)"
body = """
BEGIN
  DECLARE V_B VARCHAR(10) DEFAULT 'in';
  DECLARE V_C INTEGER DEFAULT 5;
  DECLARE V_S CHAR(5);
  DECLARE V_K INTEGER;
  SET O_STATE = '00000';
  SET O_CODE = 0;
  BEGIN
    DECLARE EXIT HANDLER FOR SQLEXCEPTION
      GET DIAGNOSTICS CONDITION 1 O_STATE = RETURNED_SQLSTATE,
        O_CODE = DB2_RETURNED_SQLCODE;
    CALL SQLDFPROBE.P_V30_CALLEE(S, V_B, V_C, V_S, V_K,
      O_N1, O_N2, O_TEXT);
    SET O_TEXT = O_TEXT || '>' || COALESCE(V_B, 'null') || '|'
      || COALESCE(TRIM(CHAR(V_C)), 'null');
  END;
END
"""

[[procedure]]
name = "V30_NAMED"
commit = "*NONE"
body = """
BEGIN
  DECLARE V_B VARCHAR(10) DEFAULT 'in';
  DECLARE V_C INTEGER DEFAULT 5;
  DECLARE V_S CHAR(5);
  DECLARE V_K INTEGER;
  SET O_STATE = '00000';
  SET O_CODE = 0;
  BEGIN
    DECLARE EXIT HANDLER FOR SQLEXCEPTION
      GET DIAGNOSTICS CONDITION 1 O_STATE = RETURNED_SQLSTATE,
        O_CODE = DB2_RETURNED_SQLCODE;
    CALL SQLDFPROBE.P_V30_CALLEE_DEF(A => 'ab', B => V_B, C => V_C,
      O_STATE => V_S, O_CODE => V_K, O_N1 => O_N1, O_N2 => O_N2,
      O_TEXT => O_TEXT);
  END;
END
"""

[[procedure]]
name = "V30_DEFAULT_KW"
commit = "*NONE"
body = """
BEGIN
  DECLARE V_B VARCHAR(10) DEFAULT 'in';
  DECLARE V_C INTEGER DEFAULT 5;
  DECLARE V_S CHAR(5);
