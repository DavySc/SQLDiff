[[probe]]
id = "V4-ROLLBACK-NONE"
fact = "V4"
role = "decisive"
procedure = "V4_ROLLBACK_NONE"
question = "Under *NONE, is ROLLBACK accepted, and does it undo anything?"
source = "IBM i 7.4 'Commitment control': changes made without commitment control cannot be rolled back. ASM-DB2-SCRIPT-COMMIT, ASM-TRY-HANDLER."
outcome = [
  { label = "accepted, nothing undone", when = { create = "00000", state = "00000", n1 = "=1" }, verdict = "consistent", meaning = "ROLLBACK is accepted and does nothing under *NONE." },
  { label = "rejected, nothing undone", when = { create = "00000", state = "!00000", n1 = "=1" }, verdict = "refines", meaning = "ROLLBACK raises an error under *NONE (see the SQLSTATE) instead of doing nothing; a converted CATCH would then fail." },
  { label = "undone", when = { create = "00000", n1 = "=0" }, verdict = "contradicts", meaning = "The insert was undone under *NONE." },
]

# ---------------------------------------------------------------- V9

[[procedure]]
name = "V9_CAST_INT"
commit = "*NONE"
params = "IN S VARCHAR(20)"
body = """
BEGIN
  DECLARE V INTEGER;
  SET O_STATE = '00000';
  SET O_CODE = 0;
  BEGIN
    DECLARE EXIT HANDLER FOR SQLEXCEPTION
      GET DIAGNOSTICS CONDITION 1 O_STATE = RETURNED_SQLSTATE,
        O_CODE = DB2_RETURNED_SQLCODE;
    SET V = CAST(S AS INTEGER);
    SET O_N1 = V;
  END;
END
"""

[[procedure]]
name = "V9_CAST_DEC"
commit = "*NONE"
params = "IN S VARCHAR(20)"
body = """
BEGIN
  DECLARE V DECIMAL(9, 2);
  SET O_STATE = '00000';
  SET O_CODE = 0;
  BEGIN
    DECLARE EXIT HANDLER FOR SQLEXCEPTION
      GET DIAGNOSTICS CONDITION 1 O_STATE = RETURNED_SQLSTATE,
        O_CODE = DB2_RETURNED_SQLCODE;
    SET V = CAST(S AS DECIMAL(9, 2));
    SET O_TEXT = TRIM(CHAR(V));
  END;
END
"""

[[procedure]]
name = "V9_CAST_LITERAL"
commit = "*NONE"
body = """
BEGIN
  DECLARE V INTEGER;
  SET O_STATE = '00000';
  SET O_CODE = 0;
  BEGIN
    DECLARE EXIT HANDLER FOR SQLEXCEPTION
      GET DIAGNOSTICS CONDITION 1 O_STATE = RETURNED_SQLSTATE,
        O_CODE = DB2_RETURNED_SQLCODE;
    SET V = CAST('' AS INTEGER);
    SET O_N1 = V;
  END;
END
"""

[[probe]]
id = "V9-INT-PLAIN"
fact = "V9"
role = "control"
procedure = "V9_CAST_INT"
args = ["'12'"]
question = "Control: CAST('12' AS INTEGER) gives 12."
source = "IBM i casting rules (character to numeric)."
outcome = [
  { label = "12", when = { create = "00000", state = "00000", n1 = "=12" }, verdict = "consistent", meaning = "Plain digits cast." },
]

