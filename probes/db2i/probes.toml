# ---------------------------------------------------------------- V25
# Each procedure reads its own program attributes from QSYS2.PROGRAM_INFO; text
# is USRPRF/DYNUSRPRF/naming, for example *OWNER/*OWNER/*SQL. The procedure names
# fit 10 characters, so the program has the same name. It then reads
# SQLDFPROBE.T: n2 = 1 if that read was refused (only meaningful when a user
# without authority to T calls it by hand, see the README).

[[procedure]]
name = "V25SQL"
commit = "*NONE"
# Created by the interface (SQL naming, as the README asks), with no USRPRF.
top_level = true
body = """
BEGIN
  SET O_STATE = '00000';
  SET O_CODE = 0;
  BEGIN
    DECLARE EXIT HANDLER FOR SQLEXCEPTION
      GET DIAGNOSTICS CONDITION 1 O_STATE = RETURNED_SQLSTATE,
        O_CODE = DB2_RETURNED_SQLCODE;
    SELECT USER_PROFILE || '/' || COALESCE(SQL_DYNAMIC_USER_PROFILE, '-')
        || '/' || COALESCE(SQL_NAMING, '-')
      INTO O_TEXT FROM QSYS2.PROGRAM_INFO
      WHERE PROGRAM_LIBRARY = 'SQLDFPROBE' AND PROGRAM_NAME = 'P_V25SQL'
        AND OBJECT_TYPE = '*PGM';
  END;
  BEGIN
    DECLARE EXIT HANDLER FOR SQLEXCEPTION SET O_N2 = 1;
    SET O_N2 = 0;
    SELECT COUNT(*) INTO O_N1 FROM SQLDFPROBE.T;
  END;
END
"""

