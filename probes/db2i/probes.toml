[[probe]]
id = "V32-NULL-COUNT"
fact = "V32"
role = "info"
procedure = "V27_INT"
args = ["'SELECT COUNT(*) FROM (SELECT K FROM (VALUES (1), (2), (3)) AS Q (K) ORDER BY K FETCH FIRST CAST(NULL AS INTEGER) ROWS ONLY) AS S'"]
question = "FETCH FIRST with a NULL count: an error (as T-SQL TOP), every row (as PostgreSQL LIMIT NULL, N1 = 3), or no row?"
source = "T-SQL raises Msg 1014 for TOP (NULL) and PostgreSQL returns every row (SQL Server 2022, PostgreSQL 18.6); the conversion carries ASM-PAGE-COUNT-NOT-NULL for a variable count."
outcome = [
  { label = "every row", when = { create = "00000", state = "00000", n1 = "=3" }, verdict = "open", meaning = "NULL means no limit, as PostgreSQL." },
  { label = "no row", when = { create = "00000", state = "00000", n1 = "=0" }, verdict = "open", meaning = "NULL keeps no row." },
  { label = "error", when = { create = "00000", state = "!00000" }, verdict = "open", meaning = "An error, as T-SQL (or the expression is not accepted there; SQLSTATE recorded)." },
  { label = "other", when = { create = "00000", state = "00000" }, verdict = "open", meaning = "Another result (in N1)." },
]
