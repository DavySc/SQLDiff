[[procedure]]
name = "V30_COMMENT"
commit = "*NONE"
params = "IN Q VARCHAR(4000)"
body = """
BEGIN
  SET O_STATE = '00000';
  SET O_CODE = 0;
  SET O_N1 = -1;
  BEGIN
    DECLARE EXIT HANDLER FOR SQLEXCEPTION
      GET DIAGNOSTICS CONDITION 1 O_STATE = RETURNED_SQLSTATE,
        O_CODE = DB2_RETURNED_SQLCODE;
    EXECUTE IMMEDIATE 'CREATE OR REPLACE VIEW SQLDFPROBE.V30V AS '
      || 'SELECT PRB FROM SQLDFPROBE.T';
    EXECUTE IMMEDIATE Q;
    SELECT LENGTH(LONG_COMMENT), SUBSTR(LONG_COMMENT, 1, 200)
      INTO O_N1, O_TEXT FROM QSYS2.SYSTABLES
      WHERE TABLE_SCHEMA = 'SQLDFPROBE' AND TABLE_NAME = 'V30V';
  END;
END
"""

