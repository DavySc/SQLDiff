question = "Control: CAST('12' AS INTEGER) gives 12."
source = "IBM i casting rules (character to numeric)."
outcome = [
  { label = "12", when = { create = "00000", state = "00000", n1 = "=12" }, verdict = "consistent", meaning = "Plain digits cast." },
]

