[[procedure]]
name = "V3_MERGE_DUP_CS"
commit = "*CS"
body = """
BEGIN
  SET O_STATE = '00000';
  SET O_CODE = 0;
  DELETE FROM SQLDFPROBE.T WHERE PRB = 31;
  INSERT INTO SQLDFPROBE.T (PRB, K, V)
    VALUES (31, 1, 0), (31, 2, 0), (31, 3, 0);
  COMMIT;
  BEGIN
    DECLARE EXIT HANDLER FOR SQLEXCEPTION
      GET DIAGNOSTICS CONDITION 1 O_STATE = RETURNED_SQLSTATE,
        O_CODE = DB2_RETURNED_SQLCODE;
    MERGE INTO SQLDFPROBE.T AS TGT
      USING (VALUES (1, 10), (2, 20), (2, 21), (3, 30)) AS SRC (K, V)
      ON TGT.PRB = 31 AND TGT.K = SRC.K
      WHEN MATCHED THEN UPDATE SET V = SRC.V;
  END;
  SELECT COUNT(*) INTO O_N1 FROM SQLDFPROBE.T WHERE PRB = 31 AND V <> 0;
  ROLLBACK;
END
"""

