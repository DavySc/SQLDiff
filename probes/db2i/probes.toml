# ---------------------------------------------------------------- V15

[[procedure]]
name = "V15_KEEP_CS"
commit = "*CS"
body = """
BEGIN
  DECLARE X INTEGER;
  SET O_STATE = '00000';
  SET O_CODE = 0;
  DELETE FROM SQLDFPROBE.T WHERE PRB = 151;
  INSERT INTO SQLDFPROBE.T (PRB, K, V) VALUES (151, 1, 7);
  COMMIT;
  BEGIN
    DECLARE EXIT HANDLER FOR SQLEXCEPTION
      GET DIAGNOSTICS CONDITION 1 O_STATE = RETURNED_SQLSTATE,
        O_CODE = DB2_RETURNED_SQLCODE;
    SELECT V INTO X FROM SQLDFPROBE.T WHERE PRB = 151 AND K = 1
      WITH RS USE AND KEEP EXCLUSIVE LOCKS;
  END;
  BEGIN
    DECLARE EXIT HANDLER FOR SQLEXCEPTION SET O_TEXT = 'lock view failed';
    SELECT COUNT(*), COALESCE(MIN(LOCK_STATE), '') || '/'
        || COALESCE(MAX(LOCK_STATE), '')
      INTO O_N1, O_TEXT FROM QSYS2.RECORD_LOCK_INFO
      WHERE TABLE_SCHEMA = 'SQLDFPROBE' AND TABLE_NAME = 'T';
  END;
  COMMIT;
  BEGIN
    DECLARE EXIT HANDLER FOR SQLEXCEPTION SET O_N2 = -1;
    SELECT COUNT(*) INTO O_N2 FROM QSYS2.RECORD_LOCK_INFO
      WHERE TABLE_SCHEMA = 'SQLDFPROBE' AND TABLE_NAME = 'T';
  END;
END
"""

[[probe]]
id = "V15-KEEP-CS"
fact = "V15"
role = "decisive"
procedure = "V15_KEEP_CS"
question = "In a *CS routine (what the converter emits), is SELECT INTO ... WITH RS USE AND KEEP EXCLUSIVE LOCKS accepted, and does it hold an exclusive record lock until COMMIT?"
source = "IBM i 7.3 'Isolation level': the isolation clause is allowed on SELECT INTO. Lock-request rules unreadable. Lock-hint note in tsql.rs. QSYS2.RECORD_LOCK_INFO (IBM i 7.3) reports LOCK_STATE, for example 'UPDATE'."
outcome = [
  { label = "exclusive lock held", when = { create = "00000", state = "00000", n1 = ">=1", text = "contains:UPDATE", n2 = "=0" }, verdict = "consistent", meaning = "Accepted; an UPDATE record lock is held until COMMIT and released by it." },
  { label = "read lock only", when = { create = "00000", state = "00000", n1 = ">=1", n2 = "=0" }, verdict = "refines", meaning = "Accepted, but the lock held is not an UPDATE lock (states in text)." },
  { label = "no lock", when = { create = "00000", state = "00000", n1 = "=0" }, verdict = "contradicts", meaning = "Accepted, but no record lock is held after the SELECT INTO." },
  { label = "lock view unreadable", when = { create = "00000", state = "00000", text = "contains:lock view failed" }, verdict = "open", meaning = "QSYS2.RECORD_LOCK_INFO could not be read; only acceptance is known." },
  { label = "create rejected", when = { create = "!00000" }, verdict = "contradicts", meaning = "The clause is not allowed on SELECT INTO in a routine (SQLSTATE in create)." },
  { label = "run error", when = { state = "!00000" }, verdict = "contradicts", meaning = "The statement fails when it runs." },
]

