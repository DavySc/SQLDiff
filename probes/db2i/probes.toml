# ---------------------------------------------------------------- V29 indexes and sequences
# What a converted CREATE INDEX or CREATE SEQUENCE relies on. The engine
# (crates/sqldiff-core/src/equiv/ddl.rs) leaves a Db2 for i UNIQUE index and a
# sequence that leaves values to Db2's defaults not proven until these are
# answered. Each probe runs up to six statements in order; O_TEXT has one letter
# per statement (Y it worked, N it failed, - not given), O_N1 the rows of
# SQLDFPROBE.UX afterwards and O_N2 its smallest K. O_STATE and O_CODE are the
# first failure's.

[[procedure]]
name = "V29_DDL"
commit = "*NONE"
params = "IN P1 VARCHAR(1000), IN P2 VARCHAR(1000), IN P3 VARCHAR(1000), IN P4 VARCHAR(1000), IN P5 VARCHAR(1000), IN P6 VARCHAR(1000)"
body = """
BEGIN
  DECLARE V_I INTEGER DEFAULT 0;
  DECLARE V_Q VARCHAR(1000);
  DECLARE V_OK CHAR(1);
  SET O_STATE = '00000';
  SET O_CODE = 0;
  SET O_TEXT = '';
  SET O_N1 = -1;
  BEGIN
    DECLARE CONTINUE HANDLER FOR SQLEXCEPTION SET V_OK = 'N';
    EXECUTE IMMEDIATE 'DROP TABLE SQLDFPROBE.UX';
    EXECUTE IMMEDIATE 'DROP SEQUENCE SQLDFPROBE.SQ';
  END;
  WHILE V_I < 6 DO
    SET V_I = V_I + 1;
    SET V_Q = CASE V_I WHEN 1 THEN P1 WHEN 2 THEN P2 WHEN 3 THEN P3
      WHEN 4 THEN P4 WHEN 5 THEN P5 ELSE P6 END;
    IF V_Q = '' THEN
      SET O_TEXT = O_TEXT || '-';
    ELSE
      SET V_OK = 'Y';
      BEGIN
        DECLARE CONTINUE HANDLER FOR SQLEXCEPTION
          BEGIN
            SET V_OK = 'N';
            IF O_STATE = '00000' THEN
              GET DIAGNOSTICS CONDITION 1 O_STATE = RETURNED_SQLSTATE,
                O_CODE = DB2_RETURNED_SQLCODE;
            END IF;
          END;
        EXECUTE IMMEDIATE V_Q;
      END;
      SET O_TEXT = O_TEXT || V_OK;
    END IF;
  END WHILE;
  BEGIN
    DECLARE CONTINUE HANDLER FOR SQLEXCEPTION SET O_N1 = -1;
    SELECT COUNT(*), MIN(K) INTO O_N1, O_N2 FROM SQLDFPROBE.UX;
  END;
END
"""

[[probe]]
id = "V29-UNIQUE-NULL"
fact = "V29"
role = "decisive"
procedure = "V29_DDL"
args = ["'CREATE TABLE SQLDFPROBE.UX (K BIGINT, S VARCHAR(10))'", "'CREATE UNIQUE INDEX SQLDFPROBE.UXI ON SQLDFPROBE.UX (K)'", "'INSERT INTO SQLDFPROBE.UX VALUES (NULL, ''a'')'", "'INSERT INTO SQLDFPROBE.UX VALUES (NULL, ''b'')'", "''", "''"]
question = "Does a UNIQUE index hold only one row with a NULL key (as T-SQL's does; PostgreSQL's holds any number unless NULLS NOT DISTINCT)?"
source = "No IBM i page was read for this probe; the engine makes no assumption and keeps such indexes not proven."
outcome = [
  { label = "one NULL", when = { text = "YYYN--", n1 = "=1" }, verdict = "open", meaning = "NULLs are equal keys, as in T-SQL: a UNIQUE index converts as it is." },
