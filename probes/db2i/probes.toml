# ---------------------------------------------------------------- V27
# DATEADD becomes labeled-duration arithmetic. The procedure runs the query Q,
# fetches its first column (an INTEGER) into n1, counts SQL warnings in n2 and
# keeps the last warning's SQLSTATE in text. Dates are compared as yyyymmdd and
# times as hhmmss numbers, so the job's date and time formats do not matter.

[[procedure]]
name = "V27_INT"
commit = "*NONE"
options = "CLOSQLCSR = *ENDMOD"
params = "IN Q VARCHAR(4000)"
body = """
BEGIN
  DECLARE V_W CHAR(5) DEFAULT '00000';
  DECLARE V_X INTEGER;
  DECLARE C1 CURSOR FOR S1;
  SET O_STATE = '00000';
  SET O_CODE = 0;
  SET O_N2 = 0;
  SET O_TEXT = '';
  BEGIN
    DECLARE EXIT HANDLER FOR SQLEXCEPTION
      GET DIAGNOSTICS CONDITION 1 O_STATE = RETURNED_SQLSTATE,
        O_CODE = DB2_RETURNED_SQLCODE;
    DECLARE CONTINUE HANDLER FOR SQLWARNING
      BEGIN
        GET DIAGNOSTICS CONDITION 1 V_W = RETURNED_SQLSTATE;
        SET O_N2 = O_N2 + 1;
        SET O_TEXT = V_W;
      END;
    PREPARE S1 FROM Q;
    OPEN C1;
    FETCH C1 INTO V_X;
    SET O_N1 = V_X;
    CLOSE C1;
  END;
END
"""

[[probe]]
id = "V27-MONTH-END"
fact = "V27"
role = "decisive"
procedure = "V27_INT"
args = ["'SELECT YEAR(D) * 10000 + MONTH(D) * 100 + DAY(D) FROM (SELECT DATE(''2024-01-31'') + 1 MONTHS AS D FROM SYSIBM.SYSDUMMY1) X'"]
question = "DATEADD(month, 1, '2024-01-31') is 2024-02-29 in T-SQL. Does DATE + 1 MONTHS clamp to the last day of February the same way, and does it raise warning 01506?"
source = "Only the assumption the converter makes (T-SQL behaviour, checked against SQL Server); the IBM i date arithmetic page could not be read."
outcome = [
  { label = "clamped, warning 01506", when = { create = "00000", state = "00000", n1 = "=20240229", text = "01506" }, verdict = "consistent", meaning = "Clamped to Feb 29 with warning 01506, as ASM-DB2-MONTH-END says." },
  { label = "clamped, no 01506", when = { create = "00000", state = "00000", n1 = "=20240229" }, verdict = "refines", meaning = "Clamped to Feb 29, but warning 01506 was not seen (TEXT has the last warning, if any); the note's warning part is wrong." },
  { label = "other", when = { create = "00000", state = "00000" }, verdict = "contradicts", meaning = "Not clamped to Feb 29: the month conversion is wrong (the value is in N1)" },
  { label = "error", when = { create = "00000", state = "!00000" }, verdict = "contradicts", meaning = "Rejected (SQLSTATE and SQLCODE recorded)" },
]

