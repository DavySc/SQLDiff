# Db2 for i probes: the source of truth for sqldiff-db2i-probes.sql.
#
# Strictly Db2 for i (IBM i 7.x). Nothing here is about Db2 for z/OS or Db2 for
# Linux, UNIX and Windows, and their documentation is not evidence for anything
# below. Every expectation names the IBM i source it rests on, or says that it is
# only the assumption the code currently makes.
#
# After editing, regenerate the script:  python3 probes/db2i/db2i_probes.py build
#
# [[procedure]]  one SQL procedure, created as SQLDFPROBE.P_<name>. Every procedure
#                has the OUT parameters O_STATE CHAR(5), O_CODE INTEGER, O_N1 INTEGER,
#                O_N2 INTEGER and O_TEXT VARCHAR(200), after any `params`.
#                `commit` becomes SET OPTION COMMIT = <commit>; "" leaves SET OPTION
#                out, so the routine takes the options of the creating interface.
#                `options` adds SET OPTION items (not COMMIT or NAMING). `naming =
#                "*SYS"` creates it under system naming (names qualified with /).
#                `top_level = true` lets the interface create it directly.
#                Bodies may not contain `--` comments (the body is sent as one line).
# [[probe]]      one call of a procedure (or an `inline` compound run at top level,
#                which sees the same O_ variables) and the outcomes it can have.
#                role: decisive (settles the fact), control (must come out as
#                expected or the decisive probes of the fact are inconclusive), info.
# outcome.when   fields: create (SQLSTATE of creating the procedure), call (SQLSTATE
#                of the CALL itself), state, code, n1, n2, text (the O_ values).
#                Patterns: "00000" exact, "!00000" set and different, "null", "*",
#                "=0", ">0", ">=1", "<3", "contains:UPDATE", "prefix:*USER/",
#                "regex:..." (the whole value must match).
#                First match wins.
# outcome.verdict  consistent (the fact or assumption holds), refines (holds in
#                substance, a detail is wrong), contradicts, open (an answer to an
#                open question, no expectation was made).
#
# Test data: table SQLDFPROBE.T (PRB, K, V); each probe uses its own PRB number.

# ---------------------------------------------------------------- harness

[[procedure]]
name = "HARNESS_NC"
commit = "*CS"
body = """
BEGIN
  SET O_STATE = '00000';
  SET O_CODE = 0;
  DELETE FROM SQLDFPROBE.T WHERE PRB = 1 WITH NC;
  BEGIN
    DECLARE EXIT HANDLER FOR SQLEXCEPTION
      GET DIAGNOSTICS CONDITION 1 O_STATE = RETURNED_SQLSTATE,
        O_CODE = DB2_RETURNED_SQLCODE;
    INSERT INTO SQLDFPROBE.T (PRB, K) VALUES (1, 1) WITH NC;
    INSERT INTO SQLDFPROBE.T (PRB, K) VALUES (1, 2);
    ROLLBACK;
  END;
  SELECT COUNT(*) INTO O_N1 FROM SQLDFPROBE.T WHERE PRB = 1 AND K = 1;
  SELECT COUNT(*) INTO O_N2 FROM SQLDFPROBE.T WHERE PRB = 1 AND K = 2;
  COMMIT;
END
"""

[[probe]]
id = "H-COMMIT-CONTROL"
fact = "HARNESS"
role = "control"
procedure = "HARNESS_NC"
question = "Does a procedure compiled with *CS run under commitment control here, and does a WITH NC insert survive its ROLLBACK? Every *CS control below relies on the first; the result log relies on the second."
source = "Isolation clause on INSERT and NC semantics: IBM i 7.3 'Isolation level' (rbafzisol.htm). WITH NC rows surviving ROLLBACK: IBM i community thread, quoting the IBM i commitment control topic."
outcome = [
  { label = "as designed", when = { create = "00000", state = "00000", n1 = "=1", n2 = "=0" }, verdict = "consistent", meaning = "Commitment control is active in *CS routines and the NC row survived the rollback." },
  { label = "no commitment control", when = { state = "00000", n2 = "=1" }, verdict = "contradicts", meaning = "The ROLLBACK undid nothing: *CS routines are not under commitment control here (are the SQLDFPROBE tables journaled?). All *CS controls are inconclusive." },
  { label = "harness error", when = { state = "!00000" }, verdict = "contradicts", meaning = "The harness statements failed; see the SQLSTATE. Often SQL7008 / 55019: the table is not journaled because the schema was not made with CREATE SCHEMA." },
]

[[probe]]
id = "ENV-OS"
fact = "ENV"
role = "info"
question = "Which IBM i release ran the probes?"
source = "SYSIBMADM.ENV_SYS_INFO."
inline = """
SELECT TRIM(CHAR(OS_VERSION)) || '.' || TRIM(CHAR(OS_RELEASE))
  INTO O_TEXT FROM SYSIBMADM.ENV_SYS_INFO;
"""
outcome = [
  { label = "recorded", when = { call = "00000" }, verdict = "open", meaning = "The release is in text." },
  { label = "not available", when = { call = "!00000" }, verdict = "open", meaning = "The view could not be read; give the release by hand when submitting." },
]

[[probe]]
id = "ENV-DB2-GROUP"
fact = "ENV"
role = "info"
question = "Which Db2 for IBM i PTF group level and Technology Refresh level are installed?"
source = "QSYS2.GROUP_PTF_INFO."
inline = """
SELECT MAX(PTF_GROUP_LEVEL) INTO O_N1 FROM QSYS2.GROUP_PTF_INFO
  WHERE PTF_GROUP_DESCRIPTION LIKE 'DB2 FOR IBM I%'
    AND PTF_GROUP_STATUS = 'INSTALLED';
SELECT MAX(PTF_GROUP_LEVEL) INTO O_N2 FROM QSYS2.GROUP_PTF_INFO
  WHERE PTF_GROUP_DESCRIPTION LIKE '%TECHNOLOGY REFRESH%'
    AND PTF_GROUP_STATUS = 'INSTALLED';
"""
outcome = [
  { label = "recorded", when = { call = "00000" }, verdict = "open", meaning = "n1 is the Db2 for IBM i group level, n2 the TR group level (null when not found)." },
  { label = "not available", when = { call = "!00000" }, verdict = "open", meaning = "The view could not be read; give the levels by hand when submitting." },
]

# ---------------------------------------------------------------- V5

[[probe]]
id = "V5-INTERFACE-COMMIT"
fact = "V5"
role = "info"
question = "Does the interface that runs this script (ACS Run SQL Scripts, RUNSQLSTM, ...) run top-level statements under commitment control?"
source = "IBM i 7.4 'Commitment control' (rbafydicomm.htm): the commit level comes from the interface; ASM-DB2-SCRIPT-COMMIT."
inline = """
DELETE FROM SQLDFPROBE.T WHERE PRB = 52 WITH NC;
INSERT INTO SQLDFPROBE.T (PRB, K) VALUES (52, 1);
ROLLBACK;
SELECT COUNT(*) INTO O_N1 FROM SQLDFPROBE.T WHERE PRB = 52;
DELETE FROM SQLDFPROBE.T WHERE PRB = 52 WITH NC;
"""
outcome = [
  { label = "commitment control", when = { call = "00000", n1 = "=0" }, verdict = "open", meaning = "The ROLLBACK undid the insert: this interface runs scripts under commitment control." },
  { label = "no commitment control", when = { call = "00000", n1 = "=1" }, verdict = "open", meaning = "The insert stayed: this interface runs scripts under *NONE or autocommit, so script COMMIT/ROLLBACK do nothing." },
  { label = "failed", when = { call = "!00000" }, verdict = "open", meaning = "See the SQLSTATE." },
]

[[procedure]]
name = "V5_DEFAULT_LEVEL"
commit = ""
# Created by the interface itself (not through RUN_DDL), so it takes the
# interface's options.
top_level = true
body = """
BEGIN
  SET O_STATE = '00000';
  SET O_CODE = 0;
  DELETE FROM SQLDFPROBE.T WHERE PRB = 51 WITH NC;
  BEGIN
    DECLARE EXIT HANDLER FOR SQLEXCEPTION
      GET DIAGNOSTICS CONDITION 1 O_STATE = RETURNED_SQLSTATE,
        O_CODE = DB2_RETURNED_SQLCODE;
    INSERT INTO SQLDFPROBE.T (PRB, K) VALUES (51, 1);
    ROLLBACK;
  END;
  SELECT COUNT(*) INTO O_N1 FROM SQLDFPROBE.T WHERE PRB = 51;
END
"""

[[probe]]
id = "V5-ROUTINE-DEFAULT"
fact = "V5"
role = "info"
procedure = "V5_DEFAULT_LEVEL"
question = "Which commit level does a procedure without SET OPTION COMMIT get when created through this interface?"
source = "IBM i 7.5 CREATE PROCEDURE (SQL): 'The default values for the options depend on the options in effect at create time.'"
outcome = [
  { label = "commitment control", when = { create = "00000", state = "00000", n1 = "=0" }, verdict = "open", meaning = "The ROLLBACK undid the insert: routines created here get a commit level other than *NONE." },
  { label = "*NONE", when = { create = "00000", state = "00000", n1 = "=1" }, verdict = "open", meaning = "The insert stayed: routines created here without SET OPTION run under *NONE." },
  { label = "failed", when = { state = "!00000" }, verdict = "open", meaning = "See the SQLSTATE." },
]

# ---------------------------------------------------------------- V4

[[procedure]]
name = "V4_ATOMIC_CS"
commit = "*CS"
body = """
BEGIN
  SET O_STATE = '00000';
  SET O_CODE = 0;
  DELETE FROM SQLDFPROBE.T WHERE PRB = 41;
  COMMIT;
  BEGIN
    DECLARE EXIT HANDLER FOR SQLEXCEPTION
      GET DIAGNOSTICS CONDITION 1 O_STATE = RETURNED_SQLSTATE,
        O_CODE = DB2_RETURNED_SQLCODE;
    BEGIN ATOMIC
      INSERT INTO SQLDFPROBE.T (PRB, K) VALUES (41, 1);
      INSERT INTO SQLDFPROBE.T (PRB, K) VALUES (41, 1);
    END;
  END;
  SELECT COUNT(*) INTO O_N1 FROM SQLDFPROBE.T WHERE PRB = 41;
  ROLLBACK;
END
"""

[[probe]]
id = "V4-ATOMIC-CS"
fact = "V4"
role = "control"
procedure = "V4_ATOMIC_CS"
question = "Under *CS, is an ATOMIC block whose second insert fails rolled back?"
source = "IBM i 7.3 compound (dynamic): 'an unhandled exception condition within the compound statement causes the compound statement to be rolled back.'"
outcome = [
  { label = "rolled back", when = { create = "00000", state = "23505", n1 = "=0" }, verdict = "consistent", meaning = "The duplicate key error rolled the ATOMIC block back." },
]

[[procedure]]
name = "V4_ATOMIC_NONE"
commit = "*NONE"
body = """
BEGIN
  SET O_STATE = '00000';
  SET O_CODE = 0;
  DELETE FROM SQLDFPROBE.T WHERE PRB = 42;
  BEGIN
    DECLARE EXIT HANDLER FOR SQLEXCEPTION
      GET DIAGNOSTICS CONDITION 1 O_STATE = RETURNED_SQLSTATE,
        O_CODE = DB2_RETURNED_SQLCODE;
    BEGIN ATOMIC
      INSERT INTO SQLDFPROBE.T (PRB, K) VALUES (42, 1);
      INSERT INTO SQLDFPROBE.T (PRB, K) VALUES (42, 1);
    END;
  END;
  SELECT COUNT(*) INTO O_N1 FROM SQLDFPROBE.T WHERE PRB = 42;
END
"""

[[probe]]
id = "V4-ATOMIC-NONE"
fact = "V4"
role = "decisive"
procedure = "V4_ATOMIC_NONE"
question = "Under *NONE, what does an ATOMIC block do when its second insert fails?"
source = "Inference in vendor-facts V4 (changes without commitment control cannot be rolled back; MERGE ignores ATOMIC under No Commit, IBM i 7.5 MERGE). Not documented for compound statements."
outcome = [
  { label = "create rejected", when = { create = "!00000" }, verdict = "consistent", meaning = "Db2 for i refuses an ATOMIC block in a *NONE routine; the create SQLSTATE is the rule." },
  { label = "call rejected", when = { call = "!00000" }, verdict = "consistent", meaning = "The routine is created but refuses to run ATOMIC under *NONE." },
  { label = "first insert stays", when = { state = "23505", n1 = "=1" }, verdict = "consistent", meaning = "ATOMIC is not honoured under *NONE: the first insert stayed." },
  { label = "rolled back", when = { state = "23505", n1 = "=0" }, verdict = "contradicts", meaning = "The block was rolled back even under *NONE." },
]

[[procedure]]
name = "V4_UNDO_CS"
commit = "*CS"
body = """
BEGIN
  DECLARE V_UNDONE INTEGER DEFAULT 0;
  SET O_STATE = '00000';
  SET O_CODE = 0;
  DELETE FROM SQLDFPROBE.T WHERE PRB = 43;
  COMMIT;
  BEGIN
    DECLARE EXIT HANDLER FOR SQLEXCEPTION
      GET DIAGNOSTICS CONDITION 1 O_STATE = RETURNED_SQLSTATE,
        O_CODE = DB2_RETURNED_SQLCODE;
    BEGIN ATOMIC
      DECLARE UNDO HANDLER FOR SQLEXCEPTION SET V_UNDONE = 1;
      INSERT INTO SQLDFPROBE.T (PRB, K) VALUES (43, 1);
      INSERT INTO SQLDFPROBE.T (PRB, K) VALUES (43, 1);
    END;
  END;
  SET O_N2 = V_UNDONE;
  SELECT COUNT(*) INTO O_N1 FROM SQLDFPROBE.T WHERE PRB = 43;
  ROLLBACK;
END
"""

[[probe]]
id = "V4-UNDO-CS"
fact = "V4"
role = "control"
procedure = "V4_UNDO_CS"
question = "Under *CS, does an UNDO handler roll the ATOMIC block back and then continue?"
source = "IBM i 7.3 compound (dynamic): UNDO 'changes made by the compound statement are rolled back'; 'If UNDO is specified, then ATOMIC must be specified.'"
outcome = [
  { label = "undone", when = { create = "00000", state = "00000", n1 = "=0", n2 = "=1" }, verdict = "consistent", meaning = "The handler ran, the block's insert was undone, and no error escaped." },
]

