# Db2 for i facts that the probes settle, and the places in the code that depend on
# them. Hand-maintained; the status of each fact lives in status.json, which
# `db2i_probes.py ingest` writes from the runs in runs/.
#
# [[fact]]  a vendor fact from docs/vendor-facts-verification.md (Db2 for i only).
#           review: files a person should reread once the fact is answered.
# [[link]]  text that hedges on a fact. While any of its facts is unverified (or
#           inconclusive, mixed, observed), the hedge must stay within the anchor's
#           line and the two lines after it. Once all of its facts are confirmed,
#           corrected or contradicted, the hedge must be gone, so the text is
#           rewritten from the evidence. crates/sqldiff-corpus/tests/db2i_probes.rs
#           checks both, and that the summary row of a resolved fact in
#           vendor-facts-verification.md mentions the probe run.

