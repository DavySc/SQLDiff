[workspace]
resolver = "2"
members = ["crates/sqldiff-syntax", "crates/sqldiff-core", "crates/sqldiff-cli", "crates/sqldiff-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false

[workspace.dependencies]
sqldiff-syntax = { path = "crates/sqldiff-syntax" }
sqldiff-core = { path = "crates/sqldiff-core" }
rowan = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
