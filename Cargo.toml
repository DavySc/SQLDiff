[workspace]
resolver = "2"
members = ["crates/sqldiff-syntax", "crates/sqldiff-core", "crates/sqldiff-source", "crates/sqldiff-review", "crates/sqldiff-convert", "crates/sqldiff-cli", "crates/sqldiff-mcp", "crates/sqldiff-gui", "crates/sqldiff-corpus"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false

[workspace.dependencies]
sqldiff-syntax = { path = "crates/sqldiff-syntax" }
sqldiff-core = { path = "crates/sqldiff-core" }
sqldiff-source = { path = "crates/sqldiff-source" }
sqldiff-review = { path = "crates/sqldiff-review" }
sqldiff-convert = { path = "crates/sqldiff-convert" }
rowan = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
toml_edit = "0.22"
clap = { version = "4", features = ["derive"] }
regex = "1"

# The hashed leak scan (sqldiff pack scan) hashes every substring of the tree.
# Unoptimized, that takes about a minute in the debug build CI uses.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.sqldiff-cli]
opt-level = 3
