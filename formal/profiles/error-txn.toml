[[case]]
id = "tsql-stmt-error-continues"
covers = ["error.after-runtime-error.tsql"]
dialect = "tsql"
faults = { b = "stmt" }
program = """
begin
write a
write b
write c
commit
"""
expect = { durable = ["a", "c"], raised = true }

[[case]]
