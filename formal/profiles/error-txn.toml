# Error and transaction profile tables (design doc section 7), in a form the
# TLA+ model checks.  gen_cases.py turns this file into ProfileCases.tla.
#
# [[cell]]  one cell of the section 7 tables: a row for one dialect.
#   status = "modelled"      at least one case must cover it
#            "not-modelled"  outside this model; `reason` says why
#            "n/a"           the dialect has no such feature
#   facts lists the section 13 fact ids the claim rests on (see
#   docs/vendor-facts-verification.md).
#
# [[case]]  a routine, its settings, a fault plan and the expected outcome.
#   dialect                tsql | postgres | db2i
#   xact_abort             T-SQL SET XACT_ABORT (default false)
#   implicit_transactions  T-SQL SET IMPLICIT_TRANSACTIONS (default false)
#   commit                 Db2 for i commit level, "NONE" or "CHG" (required for db2i)
#   caller_txn             the caller has an open transaction with its own
#                          pending work (tag "caller").  PostgreSQL: true means
#                          CALL inside a transaction block or from a function;
#                          false means a top-level CALL.
#   verified               false when the expected outcome rests on a fact
#                          that is not verified on a real system
#   faults                 write tag -> stmt | batch | uncatchable | notfound
#   expect                 durable, open, raised, aborted, code, tc, doomed
#                          (tc defaults to the entry trancount, the rest to
#                          empty / false / 0)
#
# Program syntax, one statement per line, `#` starts a comment:
#   write T [rows=2] [notatomic]      DML writing tag T (rows=2 gives T.1, T.2;
#                                     a fault fails the second row)
#   begin | commit | rollback         transaction control
#   savepoint S | rollback-to S
#   throw | raiserror                 T-SQL raising
#   raise | notice                    PL/pgSQL RAISE EXCEPTION / RAISE NOTICE
#   signal                            SQL PL SIGNAL
#   on-error [rollback] return N      T-SQL IF @@ERROR <> 0 ...; SQL PL a handler
#                                     flag or SQLSTATE check
#   on-notfound return N              @@ROWCOUNT = 0, NOT FOUND, SQLSTATE 02000
#   return N
#   try { ... } catch { ... }                         T-SQL
#   begin-exception { ... } when-others { ... }       PL/pgSQL
#   compound [atomic] [continue|exit|undo] { ... } [handler { ... }]   SQL PL
# Braces close on their own line: "} catch {", "} handler {", "}".

# ---------------------------------------------------------------- error table

[[cell]]
id = "error.after-runtime-error.tsql"
claim = "Often statement-only; some errors abort the batch"
facts = ["V10"]
status = "modelled"

[[cell]]
id = "error.after-runtime-error.postgres"
claim = "Whole transaction block doomed until rollback or savepoint, unless an exception block catches it"
status = "modelled"

[[cell]]
id = "error.after-runtime-error.db2i"
claim = "Unhandled exits the routine; warnings and not-found continue"
status = "modelled"

[[cell]]
id = "error.session-switch.tsql"
claim = "XACT_ABORT"
facts = ["V10"]
status = "modelled"

[[cell]]
id = "error.session-switch.postgres"
claim = "none"
status = "n/a"

[[cell]]
id = "error.session-switch.db2i"
claim = "none"
status = "n/a"

[[cell]]
id = "error.structured-handling.tsql"
claim = "TRY/CATCH (severity 11-19)"
facts = ["V10"]
status = "modelled"

[[cell]]
id = "error.structured-handling.postgres"
claim = "BEGIN ... EXCEPTION WHEN (subtransaction)"
facts = ["V18"]
status = "modelled"

[[cell]]
id = "error.structured-handling.db2i"
claim = "CONTINUE / EXIT / UNDO handlers (UNDO only in ATOMIC)"
facts = ["V4"]
status = "modelled"

[[cell]]
id = "error.status-checks.tsql"
claim = "@@ERROR, RETURN codes, XACT_STATE()"
facts = ["V11"]
status = "modelled"

[[cell]]
id = "error.status-checks.postgres"
claim = "FOUND, GET [STACKED] DIAGNOSTICS"
status = "modelled"

[[cell]]
id = "error.status-checks.db2i"
claim = "SQLSTATE / SQLCODE, GET DIAGNOSTICS"
status = "modelled"

[[cell]]
id = "error.raising.tsql"
claim = "THROW (honours XACT_ABORT), RAISERROR"
facts = ["V10"]
status = "modelled"

[[cell]]
id = "error.raising.postgres"
claim = "RAISE EXCEPTION; notices do not affect flow"
status = "modelled"

[[cell]]
id = "error.raising.db2i"
claim = "SIGNAL / RESIGNAL"
status = "modelled"

[[cell]]
id = "error.unterminated-statement.tsql"
claim = "THROW or ROLLBACK can be read as part of the previous statement"
status = "not-modelled"
reason = "Lexical: decided by the parser and the early checks, not by run-time semantics."

[[cell]]
id = "error.unterminated-statement.postgres"
claim = "n/a"
status = "n/a"

[[cell]]
id = "error.unterminated-statement.db2i"
claim = "n/a"
status = "n/a"

