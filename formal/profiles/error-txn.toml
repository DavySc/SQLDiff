id = "db2-statement-partial-under-none"
covers = ["atomicity.statement.db2i"]
dialect = "db2i"
commit = "NONE"
faults = { m = "stmt" }
program = """
write m rows=2
"""
expect = { durable = ["m.1"], raised = true, aborted = true }

[[case]]
id = "db2-merge-not-atomic"
covers = ["atomicity.statement.db2i"]
dialect = "db2i"
commit = "CHG"
faults = { m = "stmt" }
program = """
write m rows=2 notatomic
"""
expect = { open = ["m.1"], raised = true, aborted = true }

[[case]]
id = "db2-statement-atomic-under-commitment-control"
covers = ["atomicity.statement.db2i"]
dialect = "db2i"
commit = "CHG"
faults = { m = "stmt" }
program = """
write m rows=2
"""
expect = { raised = true, aborted = true }

[[case]]
id = "db2-worked-example"
covers = ["error.after-runtime-error.db2i"]
dialect = "db2i"
commit = "NONE"
faults = { log = "stmt" }
program = """
write stock
write log
"""
expect = { durable = ["stock"], raised = true, aborted = true }
