[[cell]]
id = "txn.ddl.tsql"
claim = "transactional in most cases"
status = "not-modelled"
reason = "DDL is not in the abstract statement set."

[[cell]]
id = "txn.ddl.postgres"
claim = "transactional"
status = "not-modelled"
reason = "DDL is not in the abstract statement set."

[[cell]]
id = "txn.ddl.db2i"
claim = "verify"
