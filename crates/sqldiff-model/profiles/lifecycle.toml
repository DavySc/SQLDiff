# Vendor lifecycle of each dialect version SQLDiff knows (RDBMS versions in
# docs/verification-roadmap.md). A version's status follows from the date:
#
#   preview    before `released` (or `released` absent)
#   supported  until `support_ends` (vendor standard, mainstream or extended
#              support; absent: no end announced)
#   legacy     until `legacy_ends` (a paid extension, or 12 months after
#              `support_ends`)
#   retired    after that
#
# Dates are `YYYY-MM-DD`, or `YYYY-MM` where only the month is known (read as
# the first of the month). `checked` says whether a person read the dates on
# the vendor's own lifecycle page (`verified`) or they come from secondary
# sources (`unverified`); AI may draft entries, a person verifies them.
#
# T-SQL keys: a SQL Server release by year; `mi-2022` and `mi-2025` are Azure
# SQL Managed Instance update policies (they upgrade themselves at the end of
# that release's mainstream support); `mi-evergreen`, `azure` and `fabric` are
# evergreen (Always-up-to-date, Azure SQL Database, Fabric SQL database).

