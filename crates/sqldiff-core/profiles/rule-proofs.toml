# The rule proof registry: every conversion rule id the converter's notes
# and trace steps can carry, and every rule-file id, with what backs it
# (docs/verified-conversion.md, C0.9).
#
# Read by `sqldiff_core::rule_proofs`; `docs/proof-coverage.md` is generated
# from it. `crates/sqldiff-core/tests/rule_proofs.rs` scans the converter's
# sources and the rule files and fails when an id is used but not listed
# here, listed but never used, or its `sites` are not the files that use it.
#
# The Lean checker (formal/lean/Sqldiff/Mirror/Lower.lean) does not read
# rule ids: it re-lowers the output on disk. A rule is lemma-backed when the
# construct it rewrites, in the form the converter writes it, is inside the
# lowering's spec; the proof then cites the section of Lower.lean whose
# rule reads that form. Everything else rests on the Rust engine comparison,
# the tests and the probes, or on a vendor fact that is not a lemma.
#
# Fields:
#   id      The id. A converter id is `tsql.<area>.<name>`, `pg.<name>`,
#           `idiom.<name>` or `db2.<name>`; a rule-file id is the head of a
#           `(translate ...)`, `(idiom ...)` or `(lint ...)` form. An id
#           ending in `*` is a family whose rest the code builds
#           (`tsql.func.<function>`, `tsql.type.<type>`, `tsql.<global>`).
#   kind    `converter` for an id a Rust rule writes; `translate`, `idiom`
#           or `lint` for a rule-file head.
#   proof   What backs the rule:
#             lemma:<Lower.lean section[/rule]>   the construct is mirrored
#                      by the Lean lowering (the output on disk is re-lowered
#                      and `Sqldiff.Mirror.check_sound` or `check_sound_c2a`
#                      applies); the citation names the section of
#                      formal/lean/Sqldiff/Mirror/Lower.lean and, after a
#                      slash, the rule within it;
#             axiom:V<n>   rests on vendor fact V<n> of
#                      docs/vendor-facts-verification.md, with no lemma;
#             engine   backed only by the Rust engine comparison, the tests
#                      and the probes.
#           A lemma covers a rule only within the slice: the note says
#           where the coverage is partial.
#   family  Optional: the family (`tsql.func.*`) a member registered on its
#           own belongs to, so that it can carry its own proof. The member's
#           name must be a string literal (upper-cased) in the family's
#           sites, and its sites are the family's.
#   note    Optional: where a lemma is partial, or what the status rests on.
#   sites   The files that use the id (relative to `crates/`).

