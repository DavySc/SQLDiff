# The assumption registry: every `ASM-*` id the engine, the rules and the
# converter can put in a report (docs/verified-conversion.md, C0 item 7).
#
# Read by `sqldiff_core::assumptions`; `docs/assumptions.md` is generated
# from it. `crates/sqldiff-core/tests/assumptions.rs` scans the sources and
# fails when an id is used but not listed here, listed but never used, or
# its `sites` are not the files that use it.
#
# Fields:
#   id         The id. `ASM-NAME-*` is a family: the code builds the rest
#              (a vendor fact, a profile row, a table name, a hash). An id
#              reported as `ASM-NAME:qualifier` (binding assumptions name the
#              object) is an instance of `ASM-NAME`.
#   statement  The assumption in one line. Reports show the emitting rule's
#              own text, which says the same for its context.
#   discharge  What can discharge it:
#                catalog     a fact a catalog snapshot holds (keys, types,
#                            collation, triggers, routines);
#                generated   code the converter or the generator writes
#                            (a constraint, a cast, the converted callee,
#                            the woven instances);
#                deployment  a declaration about the deployment that no
#                            artifact shows (callers, sessions, data);
#                nothing     none of these: a vendor fact still to verify,
#                            an engine limit, or a per-routine review.
#              A deployment profile (`[deployment] accept`) may accept any id
#              whose discharge is not `nothing`.
#   fact       The fact that would discharge it.
#   fact_key   Optional: the `[deployment.facts]` key that asserts that fact.
#   sites      The files that use the id (relative to `crates/`).

[[assumption]]
id = "ASM-APPLOCK-CHECK-RAISES"
statement = "The `IF @rc < 0` branch after sp_getapplock only rolls back and raises."
discharge = "nothing"
fact = "A reading of the branch in the source routine (the rule does not match its body)."
sites = ["sqldiff-core/profiles/rules/idioms.rules"]

[[assumption]]
id = "ASM-ARGUMENT-LENGTHS"
statement = "Arguments fit the shorter of the two sides' declared parameter types."
discharge = "deployment"
fact = "Callers never pass a value longer, larger or more precise than the shorter parameter type."
sites = ["sqldiff-core/src/equiv/mod.rs"]

[[assumption]]
id = "ASM-AUTHOR-*"
statement = "An assumption the author stated in a source comment (a pack author marker)."
discharge = "nothing"
fact = "A reviewer resolving the marker for that routine."
sites = ["sqldiff-review/src/markers.rs"]

