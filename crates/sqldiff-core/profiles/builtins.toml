# Built-in functions, procedures and types per dialect (design §3 layer 2 and §4).
#
# Binding resolves a call against routines in the catalog, then this list, then
# pack `helpers`. A name that is on another dialect's list but not on the
# target's is reported as unavailable; any other unknown name becomes an
# assumption unless the catalog describes routines.
#
# `since` maps a name to the first engine version that has it (T-SQL by
# product year, PostgreSQL by major version, Db2 for i by release).
#
# `keywords` are words that are never column or variable references when they
# do not resolve to one (non-reserved keywords still resolve to a column of
# that name first).

