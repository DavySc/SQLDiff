[package]
name = "sqldiff-convert"
description = "Rule-based dialect conversion, checked statement by statement by the SQLDiff engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[build-dependencies]
sha2.workspace = true

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sqldiff-syntax.workspace = true
sqldiff-core.workspace = true
sqldiff-model.workspace = true
sqldiff-units.workspace = true
sqldiff-draft.workspace = true
rowan.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sqldiff-source.workspace = true
sha2.workspace = true
regex.workspace = true


[dev-dependencies]
sqldiff-catalog = { workspace = true, features = ["site-switch"] }
