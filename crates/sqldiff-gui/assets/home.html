<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQLDiff</title>
<style>
/* Palette shared with index.html, convert.html and review.html; keep them in sync. */
:root {
  --bg: #f7f8fa; --panel: #ffffff; --fg: #16181d; --muted: #6b7280; --faint: #9aa1ad; --line: #e8eaee; --soft: #f1f3f6;
  --radius: 8px; --shadow: 0 1px 2px rgba(16,24,40,.05); --accent: #4f46e5; --focus: #4f46e5;
  --link-2: rgba(79,70,229,.06);
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1014; --panel: #15181d; --fg: #e6e8ec; --muted: #8b93a1; --faint: #5d6470; --line: #23272e; --soft: #1c2026;
    --shadow: 0 1px 2px rgba(0,0,0,.4); --accent: #818cf8; --focus: #818cf8;
    --link-2: rgba(129,140,248,.08);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
header { min-height: 44px; padding: 6px 12px 6px 16px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; gap: 10px; align-items: center; }
header h1 { font-size: 13px; margin: 0; font-weight: 600; display: flex; align-items: center; gap: 10px; }
header h1::before { content: ""; width: 16px; height: 16px; border-radius: 4px; background: linear-gradient(135deg, var(--accent), #06b6d4); }
.muted { color: var(--muted); font-size: 12px; }
.spacer { flex: 1; }
main { flex: 1; overflow: auto; padding: 32px 20px; }
.col { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 2px; }
.card { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); color: inherit; text-decoration: none; }
a.card:hover { border-color: var(--focus); background: var(--link-2); }
a.card:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.card .t { font-weight: 600; }
.card .s { grid-column: 1; color: var(--muted); font-size: 12.5px; min-width: 0; overflow-wrap: anywhere; }
.card .go { grid-row: 1 / span 2; grid-column: 2; color: var(--accent); font-size: 12.5px; font-weight: 500; }
.card.closed { box-shadow: none; background: transparent; border-style: dashed; }
.path { font-family: var(--mono); font-size: 12px; color: var(--fg); }
code { font-family: var(--mono); font-size: 12px; background: var(--soft); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; user-select: all; }
button { font: inherit; font-size: 12.5px; font-weight: 500; border: 1px solid transparent; background: transparent; color: var(--muted); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover:not(:disabled) { background: var(--soft); color: var(--fg); }
button.outline { border-color: var(--line); background: var(--panel); color: var(--fg); }
button.primary { border-color: var(--focus); color: var(--focus); background: var(--panel); }
button.primary:hover:not(:disabled) { background: var(--link-2); color: var(--focus); }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
input[type=text], select { font: inherit; font-size: 13px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; min-width: 0; }
input[type=text] { font-family: var(--mono); font-size: 12px; }
input[type=text]:focus, select:focus { outline: none; border-color: var(--focus); }
.form { padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); display: grid; gap: 8px; }
.side { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto 130px; gap: 8px; align-items: center; }
.side b { color: var(--muted); font-size: 12px; text-align: center; }
.acts { display: flex; align-items: center; gap: 10px; }
#cmp-err { color: #d92d20; font-size: 12.5px; flex: 1; overflow-wrap: anywhere; }
#cmp-err:empty { visibility: hidden; }
.recent { display: grid; gap: 2px; margin-top: 4px; border-top: 1px solid var(--line); padding-top: 8px; }
.recent .lbl { font-size: 11.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
.recent button { text-align: left; font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--fg); padding: 4px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent button span { color: var(--faint); font-family: inherit; }

#picker { display: none; position: fixed; inset: 0; z-index: 10; background: rgba(15,17,21,.32); align-items: flex-start; justify-content: center; padding-top: 10vh; }
#picker.on { display: flex; }
#picker .box { width: min(640px, calc(100vw - 32px)); max-height: 76vh; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 48px rgba(0,0,0,.25); overflow: hidden; }
#picker .top { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); }
#picker .top input { flex: 1; }
#pk-list { flex: 1; overflow: auto; padding: 4px; min-height: 160px; }
#pk-list button { display: flex; width: 100%; gap: 8px; align-items: center; text-align: left; color: var(--fg); font-weight: 400; font-size: 13px; padding: 4px 8px; }
#pk-list button svg { flex: none; color: var(--muted); }
#pk-list button.file { color: var(--muted); }
#pk-list button.file.sql { color: var(--fg); }
#pk-list .note { padding: 8px; color: var(--muted); font-size: 12.5px; }
#picker .bottom { display: flex; gap: 8px; align-items: center; padding: 10px; border-top: 1px solid var(--line); }
#pk-roots { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
#pk-roots button { font-family: var(--mono); font-size: 11.5px; }
</style>
</head>
<body>
<!--__SQLDIFF_SHELL__-->
<header>
  <h1>SQLDiff</h1>
  <span class="spacer"></span>
  <span class="muted" id="version"></span>
</header>
<main><div class="col">
  <div id="opened"></div>
  <h2 style="margin-top:8px" id="cmp-h">Compare files or folders</h2>
  <form class="form" id="cmp" autocomplete="off">
    <div class="side"><b>A</b><input type="text" id="cmp-a" placeholder="Old version, or the source dialect" aria-label="Side A: a file or folder" spellcheck="false"><button type="button" class="outline" data-browse="cmp-a">Browse…</button><select id="cmp-da" aria-label="Dialect of side A"></select></div>
    <div class="side"><b>B</b><input type="text" id="cmp-b" placeholder="New version, or the target dialect" aria-label="Side B: a file or folder" spellcheck="false"><button type="button" class="outline" data-browse="cmp-b">Browse…</button><select id="cmp-db" aria-label="Dialect of side B"></select></div>
    <div class="acts"><span id="cmp-err" role="alert"></span><button type="submit" class="primary" id="cmp-go">Compare</button></div>
    <div class="recent" id="recent" hidden></div>
  </form>
  <div id="more"></div>
</div></main>
<div id="picker" role="dialog" aria-modal="true" aria-label="Pick a file or folder"><div class="box">
  <div class="top"><button type="button" id="pk-up" title="Parent folder (Backspace)" aria-label="Parent folder">↑</button><input type="text" id="pk-path" aria-label="Folder" spellcheck="false"></div>
  <div id="pk-list" role="listbox" aria-label="Folder contents"></div>
  <div class="bottom"><span id="pk-roots"></span><button type="button" id="pk-cancel">Cancel</button><button type="button" class="primary" id="pk-use">Use this folder</button></div>
</div></div>
<script>
const INITIAL = /*__SQLDIFF_PAYLOAD__*/null;
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// The last two parts of a path: enough to tell recent comparisons apart.
const short = (p) => { const parts = p.split(/[\\/]/).filter(Boolean); return parts.length > 2 ? "…/" + parts.slice(-2).join("/") : p; };
const path = (p) => `<span class="path">${esc(p)}</span>`;

const $ = (id) => document.getElementById(id);
const ICON_DIR = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6.5a1 1 0 0 1 1-1h4.6l2 2h8.4a1 1 0 0 1 1 1v9.5a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/></svg>`;
const ICON_FILE = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h7l4 4v13h-11z M13.5 3.5v4h4"/></svg>`;

function card(href, title, sub, go) {
  return `<a class="card" href="${href}"><span class="t">${title}</span><span class="go">${go} →</span><span class="s">${sub}</span></a>`;
}
function closed(title, sub) {
  return `<div class="card closed"><span class="t">${title}</span><span class="s">${sub}</span></div>`;
}

function render(d) {
  $("version").textContent = "v" + d.version;
  const c = d.convert, cmp = d.compare, r = d.review;
  const open = [];
  if (cmp) {
    const n = cmp.kind === "folders" ? ` · ${cmp.pairs} pair${cmp.pairs === 1 ? "" : "s"}` : "";
    open.push(card("/compare", `Compare ${cmp.kind}`, `${path(cmp.a)} with ${path(cmp.b)}${n}`, "Open"));
  }
  if (r) open.push(card("/review", `Review ${esc(r.from)} → ${esc(r.to)}`, `${path(r.src)} converted into ${path(r.out)}`, "Open"));
  open.push(card("/convert", `Convert ${esc(c.from)} → ${esc(c.to)}`,
    (c.name ? path(c.name) : "Type or paste SQL and see it converted and checked as you type") + (c.template ? " · template" : ""), "Open"));
  $("opened").innerHTML = `<div style="display:grid;gap:10px"><h2>Open</h2>${open.join("")}</div>`;
  $("cmp-h").textContent = cmp ? "Compare something else" : "Compare files or folders";
  if (d.no_picking) {
    $("cmp").hidden = true;
    $("cmp-h").insertAdjacentHTML("afterend", closed("Not available on a network address", esc(d.no_picking.charAt(0).toUpperCase() + d.no_picking.slice(1)) + "."));
  }
  const opts = `<option value="">Dialect: auto</option>` + d.dialects.map(([id, name]) => `<option value="${esc(id)}">${esc(name)}</option>`).join("");
  $("cmp-da").innerHTML = opts; $("cmp-db").innerHTML = opts;
  const rec = $("recent");
  rec.hidden = !d.recent.length;
  rec.innerHTML = `<span class="lbl">Recent</span>` + d.recent.map((x, i) =>
    `<button type="button" data-recent="${i}" title="${esc(x.a)}\n${esc(x.b)}">${esc(short(x.a))} <span>with</span> ${esc(short(x.b))}</button>`).join("");
  rec.querySelectorAll("[data-recent]").forEach((b) => b.addEventListener("click", () => {
    const x = d.recent[+b.dataset.recent];
    $("cmp-a").value = x.a; $("cmp-b").value = x.b;
    $("cmp-da").value = x.dialect_a || ""; $("cmp-db").value = x.dialect_b || "";
    openCompare();
  }));
  $("more").innerHTML = r ? "" : `<div style="display:grid;gap:10px;margin-top:8px"><h2>More</h2>${closed("Review a converted tree", `After <code>sqldiff convert SRC -o OUT --to postgres</code>, start the app on it: <code>sqldiff-gui review SRC OUT --to postgres</code>`)}</div>`;
}

async function post(url, body) {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const text = await res.text();
  if (!res.ok) throw new Error(text || res.statusText);
  return JSON.parse(text);
}

async function openCompare() {
  const a = $("cmp-a").value.trim(), b = $("cmp-b").value.trim();
  if (!a || !b) { $("cmp-err").textContent = "Give a file or folder for both A and B."; return; }
  $("cmp-err").textContent = ""; $("cmp-go").disabled = true; $("cmp-go").textContent = "Comparing…";
  try {
    const r = await post("/api/open/compare", { a, b, dialect_a: $("cmp-da").value || null, dialect_b: $("cmp-db").value || null });
    location.href = r.open;
  } catch (e) {
    $("cmp-err").textContent = e.message;
    $("cmp-go").disabled = false; $("cmp-go").textContent = "Compare";
  }
}
$("cmp").addEventListener("submit", (e) => { e.preventDefault(); openCompare(); });

// ---------- picker ----------
const pk = { target: null, path: "", parent: null };
async function browse(p) {
  let l;
  try {
    const res = await fetch("/api/fs?path=" + encodeURIComponent(p));
    if (!res.ok) throw new Error(await res.text());
    l = await res.json();
  } catch (e) {
    $("pk-list").innerHTML = `<div class="note">${esc(e.message)}</div>`;
    return;
  }
  pk.path = l.path; pk.parent = l.parent;
  $("pk-path").value = l.path;
  $("pk-up").disabled = !l.parent;
  $("pk-roots").innerHTML = l.roots.map((r) => `<button type="button" data-go="${esc(r.path)}" title="${esc(r.path)}">${esc(r.label)}</button>`).join("");
  const sql = (n) => /\.sql$/i.test(n);
  $("pk-list").innerHTML = (l.entries.length ? l.entries.map((e, i) =>
    `<button type="button" role="option" class="${e.dir ? "dir" : "file" + (sql(e.name) ? " sql" : "")}" data-i="${i}">${e.dir ? ICON_DIR : ICON_FILE}${esc(e.name)}</button>`).join("")
    : `<div class="note">This folder is empty.</div>`) + (l.truncated ? `<div class="note">Only the first ${l.entries.length} entries are listed.</div>` : "");
  $("pk-list").querySelectorAll("[data-i]").forEach((b) => b.addEventListener("click", () => {
    const e = l.entries[+b.dataset.i];
    const full = join(l.path, e.name);
    if (e.dir) browse(full); else choose(full);
  }));
  $("pk-roots").querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => browse(b.dataset.go)));
  $("pk-list").scrollTop = 0;
}
function join(dir, name) {
  const sep = dir.includes("\\") && !dir.includes("/") ? "\\" : "/";
  return dir.endsWith(sep) ? dir + name : dir + sep + name;
}
function choose(p) {
  $(pk.target).value = p;
  closePicker();
  const other = pk.target === "cmp-a" ? "cmp-b" : "cmp-a";
  $(other).value ? $("cmp-go").focus() : $(other).focus();
}
function openPicker(target) {
  pk.target = target;
  $("picker").classList.add("on");
  const cur = $(target).value.trim() || $(target === "cmp-a" ? "cmp-b" : "cmp-a").value.trim();
  browse(cur);
  $("pk-path").focus();
}
function closePicker() { $("picker").classList.remove("on"); if (pk.target) $(pk.target).focus(); }
document.querySelectorAll("[data-browse]").forEach((b) => b.addEventListener("click", () => openPicker(b.dataset.browse)));
$("pk-up").addEventListener("click", () => pk.parent && browse(pk.parent));
$("pk-use").addEventListener("click", () => choose(pk.path));
$("pk-cancel").addEventListener("click", closePicker);
$("pk-path").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); browse($("pk-path").value); } });
$("picker").addEventListener("click", (e) => { if (e.target === $("picker")) closePicker(); });
document.addEventListener("keydown", (e) => {
  if (!$("picker").classList.contains("on")) return;
  if (e.key === "Escape") { e.preventDefault(); closePicker(); }
  if (e.key === "Backspace" && document.activeElement !== $("pk-path") && pk.parent) { e.preventDefault(); browse(pk.parent); }
});
render(INITIAL);
</script>
</body>
</html>
