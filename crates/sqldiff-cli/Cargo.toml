version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "sqldiff"
path = "src/main.rs"

[dependencies]
sqldiff-syntax.workspace = true
regex.workspace = true
sqldiff-core.workspace = true
sqldiff-source.workspace = true
sqldiff-convert.workspace = true
